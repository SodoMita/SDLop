### SDLop KMSDRM test guest - unattended install
d-i debian-installer/locale string en_US.UTF-8
d-i keyboard-configuration/xkb-keymap select us
d-i console-setup/ask_detect boolean false
d-i netcfg/choose_interface select auto
d-i netcfg/get_hostname string sdlop-kms
d-i netcfg/get_domain string local
d-i netcfg/hostname string sdlop-kms

### mirror
d-i mirror/country string manual
d-i mirror/http/hostname string deb.debian.org
d-i mirror/http/directory string /debian
d-i mirror/http/proxy string

### root only, no extra user
d-i passwd/root-password password root
d-i passwd/root-password-again password root
d-i passwd/make-user boolean false

### clock
d-i clock-setup/utc boolean true
d-i time/zone string Etc/UTC
d-i clock-setup/ntp boolean true

### disk: virtio root disk, atomic layout
d-i partman-auto/method string regular
d-i partman-auto/disk string /dev/vda
d-i partman-auto/choose_recipe select atomic
d-i partman/default_filesystem string ext4
d-i partman-partitioning/confirm_write_new_label boolean true
d-i partman/confirm_write_new_label boolean true
d-i partman/choose_partition select Finish partitioning and write changes to disk
d-i partman/confirm boolean true
d-i partman/confirm_nooverwrite boolean true

### packages: no recommends to keep it lean; everything needed to build+test SDLop
d-i pkgsel/install-recommends boolean false
d-i pkgsel/include string openssh-server build-essential cmake ninja-build pkg-config libdrm-dev libgbm-dev libegl-dev libgles-dev libgl-dev libvulkan-dev libxkbcommon-dev libwayland-dev wayland-protocols libdrm-tests kmscube
d-i pkgsel/upgrade select none
d-i popularity-contest/participate boolean false

### bootloader
d-i grub-installer/only_debian boolean true
d-i grub-installer/bootdev string /dev/vda

### sshd: allow root login with password (test VM only)
d-i preseed/late_command string \
    in-target sed -i -E 's/^#?PermitRootLogin.*/PermitRootLogin yes/' /etc/ssh/sshd_config; \
    in-target systemctl enable ssh; \
    in-target update-initramfs -u

### poweroff when done so the harness can detect completion
d-i debian-installer/exit/poweroff boolean true
